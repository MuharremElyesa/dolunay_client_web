<!-- Dolunay Giriş yapma sayfası -->
<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dolunay Oturum Sayfası</title>
    <link rel="icon" type="image/x-icon" href="./images/ico/dolunay.ico">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/login.css">
</head>

<body>
    <!-- Ana konteyner -->
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <!-- Giriş formu -->
        <div class="card p-4 shadow login-card" style="width: 100%; max-width: 400px;">
            <img src="./images/logo-yazili.png" alt="Dolunay Logo" class="img-fluid mb-3">
            <form id="loginForm">
                <div class="mb-3">
                    <label for="username" class="form-label">Kullanıcı Adı</label>
                    <input type="text" class="form-control" id="username" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Şifre</label>
                    <input type="password" class="form-control" id="password" required>
                </div>
                <button type="submit" class="btn w-100">Giriş Yap</button>
            </form>

            <div class="mt-3 text-center">
                <a href="#" id="forgotPasswordLink">Şifremi Unuttum</a>
            <hr>

            </div>
            <!-- google ile giriş -->
            <div class="mt-3 text-center">
                <button class="btn w-100 social-login-btn" onclick="signInGoogle()"><img src="./images/ico/google.svg" alt="Google Logo" class="btn-icon" width="20" height="20">Google ile Giriş Yap</button>
            </div>
            <!-- facebook ile giriş -->
            <div class="mt-3 text-center">
                <button class="btn w-100 social-login-btn" onclick="signInFacebook()"><img src="./images/ico/facebook.svg" alt="Facebook Logo" class="btn-icon" width="20" height="20">Facebook ile Giriş Yap</button>
            </div>
            <!-- github ile giriş -->
            <div class="mt-3 text-center">
                <button class="btn w-100 social-login-btn" onclick="signInGithub()"><img src="./images/ico/github.svg" alt="GitHub Logo" class="btn-icon" width="20" height="20">GitHub ile Giriş Yap</button>
            </div>
            <!-- discord ile giriş -->
            <div class="mt-3 text-center">
                <button class="btn w-100 social-login-btn" onclick="signInDiscord()"><img src="./images/ico/discord.svg" alt="Discord Logo" class="btn-icon" width="20" height="20">Discord ile Giriş Yap</button>
            </div>

        </div>

        <!-- Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
        <script src="./js/login.js"></script>
</body>

</html>
